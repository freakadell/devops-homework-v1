apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway-webappprod-http
  namespace: prod
spec:
  gatewayClassName: traefik
  listeners:
  - name: web
    hostname: webappprod.riives.eu
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-app
  namespace: prod
spec:
  hostnames:
  - webappprod.riives.eu
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway-webappprod-http
    sectionName: web
    namespace: prod
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: web-app-service
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
