name: CD - Deploy to K8s

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push to Registry
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}

    - name: Install Cloudflared
      run: |
        sudo mkdir -p --mode=0755 /usr/share/keyrings
        curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
        echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
        sudo apt-get update && sudo apt-get install cloudflared -y

    - name: Start Cloudflare Access Proxy
      env:
        CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
        CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
      run: |
        cloudflared access tcp --hostname homek8skjhkjh.riives.eu --url localhost:8443 \
          --id "$CF_CLIENT_ID" --secret "$CF_CLIENT_SECRET" &
        sleep 3 # Wait for the proxy to start

    - name: Set up Kubeconfig
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Update image tag and deploy
      run: |
        sed -i "s|image: ghcr.io/.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|g" k8s/deployment.yaml
        
        kubectl_cmd="kubectl --server=https://localhost:8443 --insecure-skip-tls-verify"
        
        $kubectl_cmd apply -f k8s/dev/configmap.yaml
        $kubectl_cmd apply -f k8s/dev/deployment.yaml
        $kubectl_cmd apply -f k8s/dev/service.yaml
        $kubectl_cmd apply -f k8s/dev/ingress.yaml
