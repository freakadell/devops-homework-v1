name: CD - Deploy to K8s

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push to Registry
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}

    - name: Set up Kubeconfig
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Update image tag and deploy
      env:
        CF_ID: ${{ secrets.CF_CLIENT_ID }}
        CF_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
      run: |
        sed -i "s|image: ghcr.io/.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|g" k8s/dev/deployment.yaml
        
        alias_kube="kubectl --header='CF-Access-Client-Id: $CF_ID' --header='CF-Access-Client-Secret: $CF_SECRET'"
        
        $alias_kube apply -f k8s/dev/configmap.yaml
        $alias_kube apply -f k8s/dev/deployment.yaml
        $alias_kube apply -f k8s/dev/service.yaml
        $alias_kube apply -f k8s/dev/ingress.yaml
